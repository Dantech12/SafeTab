<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SafeTab Portal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" hidden>
      <a class="brand" href="#/">
        <span class="brand-mark" data-icon="shield"></span>
        <span class="brand-name">SafeTab</span>
      </a>
      <nav class="side-nav" aria-label="Main">
        <a href="#/" data-nav="home"><span data-icon="home"></span><span>Home</span></a>
        <a href="#/privacy" data-nav="privacy"><span data-icon="eye"></span><span>What we collect</span></a>
        <a href="#/billing" data-nav="billing" data-admin-only><span data-icon="card"></span><span>Billing</span></a>
        <a href="#/audit" data-nav="audit" data-admin-only><span data-icon="activity"></span><span>Activity log</span></a>
      </nav>
      <div class="side-foot">
        <div class="org-chip"><span class="org-avatar" id="org-avatar"></span><span class="org-name" id="org-name"></span></div>
      </div>
    </aside>
    <div class="content">
      <header class="appbar" id="appbar" hidden>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="usermenu">
          <button type="button" class="user-btn" id="user-btn" aria-haspopup="menu" aria-expanded="false">
            <span class="user-avatar" id="user-avatar"></span>
            <span class="user-meta"><span class="user-name" id="user-name"></span><span class="user-role" id="user-role"></span></span>
            <span data-icon="chevdown"></span>
          </button>
          <div class="menu" id="user-menu" role="menu" hidden>
            <div class="menu-head"><strong id="menu-name"></strong><span id="menu-email"></span></div>
            <a role="menuitem" href="#/billing" data-admin-only><span data-icon="card"></span>Billing</a>
            <a role="menuitem" href="/contact" target="_blank" rel="noopener"><span data-icon="info"></span>Help &amp; support</a>
            <button type="button" role="menuitem" data-action="logout"><span data-icon="logout"></span>Sign out</button>
          </div>
        </div>
      </header>
      <div id="flash" role="status" aria-live="polite"></div>
      <main id="app"><div class="loader" aria-label="Loading"></div></main>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
