# Local development database only. Sample credentials; do not reuse elsewhere.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: safetab
      POSTGRES_PASSWORD: safetab_dev_only
      POSTGRES_DB: safetab
    ports: ["5432:5432"]
    volumes:
      - ./db/dev-init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
